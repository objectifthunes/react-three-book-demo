name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout React wrapper source
        uses: actions/checkout@v4
        with:
          repository: MaxouJS/react-three-book
          ref: 798d0d2cf39b2756ddce509df59f6abe33336081
          path: .packages/react-three-book
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .packages/react-three-book/pnpm-lock.yaml
      # @objectifthunes/* are RESTRICTED packages. Metadata reads authenticate
      # via the scope registry, but the tarball download only carries the token
      # when always-auth is set — without it the .tgz GET is anonymous and 404s.
      - name: Authenticate to npm
        run: |
          {
            echo "@objectifthunes:registry=https://registry.npmjs.org/"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
            echo "always-auth=true"
          } >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The granular npm token can read the existing restricted package but
      # cannot publish 0.9.0. Build the exact pushed wrapper commit locally so
      # Pages does not depend on an unavailable registry tarball.
      - name: Install React wrapper workspace
        working-directory: .packages/react-three-book
        run: pnpm install --frozen-lockfile
      - name: Build React wrapper package
        working-directory: .packages/react-three-book
        run: pnpm --filter @objectifthunes/react-three-book prepack
      - name: Use local React wrapper package
        run: pnpm pkg set 'dependencies.@objectifthunes/react-three-book=file:./.packages/react-three-book/packages/react-three-book'
      - name: Install demo
        run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
